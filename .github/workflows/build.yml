name: Build Android App (APK & AAB & SHA)
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'
    - name: Build (Maven Central 429 icin 3 deneme)
      run: |
        for i in 1 2 3; do
          gradle -p . assembleDebug bundleDebug --no-daemon --stacktrace && exit 0
          echo "Deneme $i basarisiz, 60 sn bekleniyor..."
          sleep 60
        done
        exit 1
      working-directory: ${{ github.workspace }}
    - run: |
        mkdir -p output_artifacts
        cp app/build/outputs/apk/debug/app-debug.apk output_artifacts/NAMAZ_ASiSTANI_debug.apk
        cp app/build/outputs/bundle/debug/app-debug.aab output_artifacts/NAMAZ_ASiSTANI_debug.aab
        cd output_artifacts
        sha256sum NAMAZ_ASiSTANI_debug.apk NAMAZ_ASiSTANI_debug.aab > checksums.txt
        cat checksums.txt
    - uses: actions/upload-artifact@v4
      with:
        name: NAMAZ_ASiSTANI-apk-aab-and-sha
        path: output_artifacts/
